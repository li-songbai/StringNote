name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore app/Xianpu.Desktop/Xianpu.Desktop.csproj

      - name: Build Release
        run: dotnet build app/Xianpu.Desktop/Xianpu.Desktop.csproj -c Release --no-restore
