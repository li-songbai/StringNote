name: Release StringNote

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0-beta.1 or 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $ver = "${{ github.event.inputs.version }}" -replace '^v', ''
            if ([string]::IsNullOrWhiteSpace($ver)) {
              $ver = '1.0.0'
            }
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $ver"

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          dotnet publish app/Xianpu.Desktop/Xianpu.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$ver `
            -o publish-win-x64

      - name: Create portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "publish-win-x64\*" -DestinationPath "dist\StringNote-Portable-win-x64-$ver.zip" -Force

      - name: Ensure Inno Setup 6 and build installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $defaultPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            }
          }
          if (-not $iscc) {
            choco install innosetup -y
            $defaultPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              $iscc = "iscc"
            }
          }
          & $iscc "/DAppVersion=$ver" "/DPublishDir=..\publish-win-x64" "installer\StringNote.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 弦笺 v${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/StringNote-Setup-*.exe
            dist/StringNote-Portable-*.zip
