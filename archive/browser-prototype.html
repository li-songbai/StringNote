<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>弦谱 · 歌词和弦记谱</title>
<style>
.btn{font-family:inherit;font-size:12px;font-weight:600}.field input{font-family:inherit;font-size:13px}.icon-btn{font-family:inherit;font-size:12px}.search{font-family:inherit;font-size:12px}.filter{font-family:inherit;font-size:11px}.library-note,.panel-sub,.sheet-help{font-family:inherit}
:root{font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;color:#232820;background:#f3f3ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:340px}.app{max-width:1460px;margin:auto;padding:22px 26px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:750}.brand-icon{width:31px;height:31px;border-radius:9px;background:#263d32;color:white;display:grid;place-items:center;font-size:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #dddeda;border-radius:8px;background:white;color:#343a32;padding:8px 12px;font:600 12px inherit;cursor:pointer}.btn:hover{border-color:#9eaf9d;background:#f9faf7}.btn.primary{background:#263d32;color:white;border-color:#263d32}.btn.primary:hover{background:#355743}.btn:disabled{opacity:.45;cursor:default}.song-info{display:grid;grid-template-columns:minmax(230px,2fr) repeat(3,minmax(110px,1fr));gap:10px;background:#fff;border:1px solid #e5e5de;border-radius:12px;padding:13px 15px;margin-bottom:16px}.field label{display:block;color:#7a8075;font-size:10px;font-weight:700;margin:0 0 5px}.field input{width:100%;height:35px;border:1px solid #e7e8e1;border-radius:7px;background:#fdfdfb;padding:0 10px;font:13px inherit;color:#292e28;outline:none}.field input:focus,.search:focus{border-color:#82987e;box-shadow:0 0 0 3px #82987e1b}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:15px;align-items:start}.work-panel,.library{border:1px solid #e4e4dd;background:#fff;border-radius:12px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid #ecece7}.panel-title{font-size:13px;font-weight:750}.panel-sub{font-size:11px;color:#858a80;margin-top:3px}.score-actions{display:flex;align-items:center;gap:7px}.icon-btn{border:1px solid #e2e3dc;background:white;border-radius:7px;padding:6px 9px;font:12px inherit;color:#575d53;cursor:pointer}.icon-btn:hover{background:#f4f6f1}.include-toggle{font-size:11px;color:#757b72;display:flex;gap:6px;align-items:center;white-space:nowrap}.canvas-scroll{overflow:auto;background:#e9eae4;padding:17px}.paper{width:1100px;max-width:none;margin:0 auto;background:white;box-shadow:0 4px 15px #28302016;line-height:0}#score{display:block;width:1100px;height:auto;touch-action:none;cursor:crosshair}.sheet-help{display:flex;align-items:center;gap:7px;padding:10px 14px;color:#747b71;font-size:11px;border-top:1px solid #ecece7}.help-dot{width:17px;height:17px;border-radius:50%;background:#eef2eb;color:#526a50;display:grid;place-items:center;font-weight:800;flex:none}.selected-bar{margin-left:auto;color:#466648;font-weight:700}.library-head{padding:14px 14px 10px;border-bottom:1px solid #ecece7}.library-title{font-size:14px;font-weight:750}.library-note{font-size:11px;color:#81877d;line-height:1.55;margin:6px 0 10px}.search{width:100%;height:34px;border:1px solid #e4e5de;border-radius:7px;padding:0 10px;font:12px inherit;outline:none}.filter-row{display:flex;gap:5px;padding:9px 12px 2px}.filter{border:1px solid transparent;background:transparent;border-radius:14px;padding:5px 9px;color:#777d73;font:11px inherit;cursor:pointer}.filter.active{background:#eaf0e7;color:#38583a;font-weight:700}.chord-grid{padding:8px 10px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:560px;overflow:auto}.chord-card{border:1px solid #e9eae4;border-radius:9px;background:#fff;min-width:0;padding:7px 6px 8px;text-align:center;cursor:grab;user-select:none;transition:.12s}.chord-card:hover{border-color:#9cb195;background:#fbfcf9;transform:translateY(-1px)}.chord-card.selected{border:2px solid #638360;background:#f4f8f1;padding:6px 5px 7px;box-shadow:0 0 0 2px #63836016}.chord-name{font-size:14px;font-weight:800;color:#344637;margin-bottom:2px}.chord-shape{font-size:9px;color:#93998f;margin-top:1px}.chord-card svg{display:block;margin:1px auto 0;width:82px;height:91px}.empty-library{padding:24px 12px;text-align:center;color:#8b9087;font-size:12px}.status{position:fixed;bottom:19px;left:50%;transform:translate(-50%,12px);background:#263d32;color:#fff;border-radius:9px;padding:10px 15px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 5px 22px #0002;z-index:5}.status.show{opacity:1;transform:translate(-50%,0)}input[type=file]{display:none}dialog{width:min(520px,calc(100vw - 28px));border:1px solid #e0e3dc;border-radius:13px;padding:0;box-shadow:0 20px 80px #18201440}dialog::backdrop{background:#17201866}.dialog-head{font-size:15px;font-weight:750;padding:16px 18px;border-bottom:1px solid #ecece7}.dialog-body{padding:16px 18px}.dialog-body label{display:block;font-size:11px;color:#737a70;margin-bottom:7px}.dialog-body textarea{width:100%;min-height:96px;resize:vertical;border:1px solid #dfe2da;border-radius:8px;padding:10px;font:15px/1.6 "Microsoft YaHei",sans-serif;outline:none}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}.empty-score{color:#888e84}.empty-score-title{font-size:20px;font-weight:750;fill:#344137}.empty-score-sub{font-size:13px;fill:#7b8178}
@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr) 270px}.app{padding:18px 14px 32px}}@media(max-width:760px){.workspace{grid-template-columns:1fr}.library{grid-row:1}.chord-grid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:310px}.song-info{grid-template-columns:repeat(2,minmax(0,1fr))}.song-info .field:first-child{grid-column:span 2}.topbar{align-items:flex-start}.panel-head{flex-wrap:wrap}.score-actions{flex-wrap:wrap}.include-toggle{display:none}.app{padding:13px 10px 26px}.canvas-scroll{padding:9px}.paper{margin:0}}

<body>
<main class="app">
 <header class="topbar">
  <div class="brand"><span class="brand-icon">♬</span><span>弦谱</span></div>
  <div class="actions"><button class="btn" id="openProject">打开项目</button><button class="btn" id="saveProject">保存项目</button><button class="btn primary" id="exportImage">导出 PNG</button><input id="projectFile" type="file" accept=".json,application/json"><input id="lrcFile" type="file" accept=".lrc,.txt,text/plain"></div>
 </header>
 <section class="song-info" aria-label="歌曲信息">
  <div class="field"><label for="songTitle">歌曲名称</label><input id="songTitle" placeholder="未命名歌曲"></div>
  <div class="field"><label for="originalKey">原调</label><input id="originalKey" placeholder="如 C"></div>
  <div class="field"><label for="selectedKey">选调</label><input id="selectedKey" placeholder="如 G"></div>
  <div class="field"><label for="capo">变调夹</label><input id="capo" placeholder="如 2 品"></div>
 </section>
 <div class="workspace">
  <section class="work-panel">
   <div class="panel-head"><div><div class="panel-title">歌词和弦谱 <span id="lineCount" class="panel-sub"></span></div><div class="panel-sub">编辑的就是最终谱面：和弦在歌词上方，可以直接拖动</div></div><div class="score-actions"><label class="include-toggle"><input type="checkbox" id="includeDiagrams" checked> 谱头显示用到的指法图</label><button class="icon-btn" id="removeChord" disabled>删除选中和弦</button><button class="icon-btn" id="importLrc">导入 LRC</button><button class="icon-btn" id="addLyric">＋ 歌词行</button></div></div>
   <div class="canvas-scroll"><div class="paper"><canvas id="score" aria-label="可直接编辑的歌词和弦谱"></canvas></div></div>
   <div class="sheet-help"><span class="help-dot">i</span><span>拖右侧和弦到歌词，或选中和弦后点歌词插入。拖动谱上的和弦可改位置；右键和弦也可删除，双击歌词可编辑。</span><span class="selected-bar" id="selectedLabel">未选择和弦</span></div>
  </section>
  <aside class="library">
   <div class="library-head"><div class="library-title">左手和弦库</div><div class="library-note">每张卡片都带指法图。点击选中后，点歌词插入；也可以把卡片直接拖到换和弦的字上。图中左至右为 6 弦低音 E 到 1 弦高音 e；× 不弹，○ 空弦，圆点数字是左手指法。</div><input id="chordSearch" class="search" placeholder="搜索和弦，如 C、Am、F#m"></div>
   <div class="filter-row"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="open">开放和弦</button><button class="filter" data-filter="barre">横按和弦</button></div>
   <div class="chord-grid" id="chordGrid"></div>
  </aside>
 </div>
</main>
<dialog id="lyricDialog"><form method="dialog" id="lyricForm"><div class="dialog-head" id="lyricDialogTitle">编辑歌词</div><div class="dialog-body"><label for="lyricText">这一行歌词</label><textarea id="lyricText" placeholder="输入或修改这一句歌词"></textarea></div><div class="dialog-actions"><button class="btn" value="cancel">取消</button><button class="btn primary" id="confirmLyric" value="save">保存</button></div></form></dialog>
<div class="status" id="status"></div>
<script>
(()=>{
 const $=s=>document.querySelector(s), canvas=$('#score'), ctx=canvas.getContext('2d'), grid=$('#chordGrid');
 const W=1100,M=72,LYRIC_FONT='19px "Microsoft YaHei", sans-serif',CHORD_FONT='bold 17px "Microsoft YaHei", sans-serif';
 const noteNames=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
 const shapes=[];
 function shape(id,name,type,frets,fingers,base=1,barre=null,label='开放') {shapes.push({id,name,type,frets,fingers,base,barre,label})}
 shape('C','C','open',['x',3,2,0,1,0],[0,3,2,0,1,0]);shape('D','D','open',['x','x',0,2,3,2],[0,0,0,1,3,2]);shape('E','E','open',[0,2,2,1,0,0],[0,2,3,1,0,0]);shape('F','F','barre',[1,3,3,2,1,1],[1,3,4,2,1,1],1,{fret:1,from:0,to:5},'E 形横按');shape('G','G','open',[3,2,0,0,0,3],[2,1,0,0,0,3]);shape('A','A','open',['x',0,2,2,2,0],[0,0,1,2,3,0]);
 shape('Am','Am','open',['x',0,2,2,1,0],[0,0,2,3,1,0]);shape('Dm','Dm','open',['x','x',0,2,3,1],[0,0,0,2,3,1]);shape('Em','Em','open',[0,2,2,0,0,0],[0,2,3,0,0,0]);
 shape('A7','A7','open',['x',0,2,0,2,0],[0,0,2,0,3,0]);shape('D7','D7','open',['x','x',0,2,1,2],[0,0,0,2,1,3]);shape('E7','E7','open',[0,2,0,1,0,0],[0,2,0,1,0,0]);shape('G7','G7','open',[3,2,0,0,0,1],[3,2,0,0,0,1]);shape('C7','C7','open',['x',3,2,3,1,0],[0,3,2,4,1,0]);
 shape('Am7','Am7','open',['x',0,2,0,1,0],[0,0,2,0,1,0]);shape('Em7','Em7','open',[0,2,2,0,3,0],[0,2,3,0,4,0]);shape('Fmaj7','Fmaj7','open',['x','x',3,2,1,0],[0,0,3,2,1,0]);shape('Dmaj7','Dmaj7','open',['x','x',0,2,2,2],[0,0,0,1,2,3]);shape('Amaj7','Amaj7','open',['x',0,2,1,2,0],[0,0,2,1,3,0]);
 shape('Asus2','Asus2','open',['x',0,2,2,0,0],[0,0,1,2,0,0]);shape('Asus4','Asus4','open',['x',0,2,2,3,0],[0,0,1,2,3,0]);shape('Dsus2','Dsus2','open',['x','x',0,2,3,0],[0,0,0,1,3,0]);shape('Dsus4','Dsus4','open',['x','x',0,2,3,3],[0,0,0,1,3,4]);shape('Esus4','Esus4','open',[0,2,2,2,0,0],[0,1,2,3,0,0]);
 for(let f=1;f<=11;f++){
  const root=noteNames[(4+f)%12];if(!['F','F#','G','Ab','Bb','B','C','C#','D','Eb'].includes(root))continue;
  if(root!=='F')shape(`barre-E-${root}`,root,'barre',[f,f+2,f+2,f+1,f,f],[1,3,4,2,1,1],f,{fret:f,from:0,to:5},'E 形横按');
  shape(`barre-Em-${root}`,root+'m','barre',[f,f+2,f+2,f,f,f],[1,3,4,1,1,1],f,{fret:f,from:0,to:5},'Em 形横按');
 }
 for(let f=1;f<=11;f++){
  const root=noteNames[(9+f)%12];if(!['Bb','B','C','C#','D','Eb','E','F','F#','G','Ab'].includes(root))continue;
  shape(`barre-A-${root}`,root,'barre',['x',f,f+2,f+2,f+2,f],[0,1,3,3,3,1],f,{fret:f,from:1,to:5},'A 形横按');
  shape(`barre-Am-${root}`,root+'m','barre',['x',f,f+2,f+2,f+1,f],[0,1,3,4,2,1],f,{fret:f,from:1,to:5},'Am 形横按');
 }
 const shapeById=new Map(shapes.map(s=>[s.id,s])), firstByName=new Map();for(const s of shapes)if(!firstByName.has(s.name))firstByName.set(s.name,s);
 let data={title:'',originalKey:'',selectedKey:'',capo:'',includeDiagrams:true,lines:[]};let selectedShape=null,selectedChord=null,selectedLine=null,selectedPlaced=null,anchor=null,drag=null,filter='all',toastTimer,editLine=null,scoreLayout=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function toast(s){const e=$('#status');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2100)}
 function persist(){try{localStorage.setItem('xianpu-project',JSON.stringify(data))}catch{}}
 function syncMeta(){data.title=$('#songTitle').value;data.originalKey=$('#originalKey').value;data.selectedKey=$('#selectedKey').value;data.capo=$('#capo').value;persist();drawScore()}
 function svgDiagram(s){const x0=17,y0=25,dx=11.5,dy=12.8,w=80,h=87;let out=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-label="${esc(s.name)} 指法图">`;for(let i=0;i<6;i++){const mark=s.frets[i]==='x'?'×':s.frets[i]===0?'○':'';if(mark)out+=`<text x="${x0+i*dx}" y="14" text-anchor="middle" font-size="10" fill="#697167">${mark}</text>`}for(let i=0;i<6;i++)out+=`<path d="M${x0+i*dx} ${y0}v${dy*4}" stroke="#aeb4aa" stroke-width="1"/>`;for(let j=0;j<=4;j++)out+=`<path d="M${x0} ${y0+j*dy}h${dx*5}" stroke="${j===0&&s.base===1?'#526050':'#c4c9c0'}" stroke-width="${j===0&&s.base===1?2.4:1}"/>`;if(s.base>1)out+=`<text x="3" y="${y0+dy*.6}" font-size="8" fill="#858b80">${s.base}品</text>`;if(s.barre){const fy=y0+(s.barre.fret-s.base+.5)*dy;out+=`<rect x="${x0+s.barre.from*dx-4}" y="${fy-4}" width="${(s.barre.to-s.barre.from)*dx+8}" height="8" rx="4" fill="#425943"/>`;out+=`<text x="${x0+s.barre.from*dx}" y="${fy+2.5}" text-anchor="middle" font-size="7" fill="white">1</text>`}for(let i=0;i<6;i++){const fret=s.frets[i];if(typeof fret!=='number'||fret===0||s.barre&&s.fingers[i]===1&&fret===s.barre.fret)continue;const cy=y0+(fret-s.base+.5)*dy,cx=x0+i*dx;out+=`<circle cx="${cx}" cy="${cy}" r="4.2" fill="#425943"/><text x="${cx}" y="${cy+2.5}" text-anchor="middle" font-size="6.5" fill="white">${s.fingers[i]||''}</text>`}return out+'</svg>'}
 function renderLibrary(){const q=$('#chordSearch').value.trim().toLowerCase();const list=shapes.filter(s=>(filter==='all'||s.type===filter)&&(!q||s.name.toLowerCase().includes(q)||s.label.toLowerCase().includes(q)));grid.innerHTML=list.length?list.map(s=>`<div class="chord-card${selectedShape?.id===s.id?' selected':''}" data-shape="${s.id}" draggable="true" tabindex="0" title="拖到歌词上放置 ${s.name}"><div class="chord-name">${esc(s.name)}</div>${svgDiagram(s)}<div class="chord-shape">${esc(s.label)}</div></div>`).join(''):'<div class="empty-library">没有找到这个和弦</div>';grid.querySelectorAll('[data-shape]').forEach(card=>{const s=shapeById.get(card.dataset.shape);card.onclick=()=>{selectedShape=s;selectedChord={name:s.name,shapeId:s.id};selectedPlaced=null;$('#removeChord').disabled=true;renderLibrary();updateSelectedLabel();toast(`已选中 ${s.name}，点击歌词插入或拖过去`)};card.ondragstart=e=>{e.dataTransfer.setData('application/x-xianpu-chord',s.id);e.dataTransfer.effectAllowed='copy';selectedShape=s;selectedChord={name:s.name,shapeId:s.id};updateSelectedLabel()};card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}}})}
 function updateSelectedLabel(){const e=$('#selectedLabel');e.textContent=selectedChord?`已选 ${selectedChord.name} · 点谱面插入`:'未选择和弦'}
 function wrapText(text,ctx,maxWidth){const chars=[...text];if(!chars.length)return[{start:0,end:0,text:''}];const result=[];let start=0,current='',width=0;for(let i=0;i<chars.length;i++){const cw=ctx.measureText(chars[i]).width;if(current&&width+cw>maxWidth){result.push({start,end:i,text:current});start=i;current='';width=0}current+=chars[i];width+=cw}result.push({start,end:chars.length,text:current});return result}
 function usedShapes(){const found=[];for(const line of data.lines)for(const c of line.chords){const s=shapeById.get(c.shapeId)||firstByName.get(c.name);if(s&&!found.some(x=>x.id===s.id))found.push(s)}return found}
 function layoutScore(ctx){ctx.font=LYRIC_FONT;const textWidth=W-M*2,diagrams=data.includeDiagrams?usedShapes():[],cols=8,diagramRows=Math.ceil(diagrams.length/cols),headerHeight=diagrams.length?88+diagramRows*112:132,lines=[];let y=headerHeight+20;for(let i=0;i<data.lines.length;i++){const line=data.lines[i],chunks=wrapText(line.text,ctx,textWidth),placements=[];for(let j=0;j<line.chords.length;j++){const c=line.chords[j],pos=Math.max(0,Math.min(c.pos,[...line.text].length));let k=chunks.findIndex((ch,n)=>pos>=ch.start&&(pos<ch.end||n===chunks.length-1));if(k<0)k=chunks.length-1;const ch=chunks[k];ctx.font=LYRIC_FONT;const x=M+ctx.measureText([...line.text].slice(ch.start,pos).join('')).width;placements.push({lineIndex:i,chordIndex:j,name:c.name,x,y:y+12+k*27,chunkIndex:k})}const height=Math.max(64,chunks.length*27+36);lines.push({index:i,text:line.text,y,height,chunks,placements});y+=height+12}return{width:W,height:Math.max(390,y+40),headerHeight,diagrams,diagramRows,lines}}
 function drawDiagram(ctx,s,x,y,small=false){const scale=small ? 0.78 : 1,dx=12*scale,dy=13*scale,x0=x+12*scale,y0=y+24*scale;ctx.fillStyle='#303a30';ctx.font=`bold ${small?11:13}px "Microsoft YaHei", sans-serif`;ctx.textAlign='center';ctx.fillText(s.name,x+44*scale,y+12*scale);ctx.font=`${small?8:9}px "Microsoft YaHei", sans-serif`;ctx.fillStyle='#727970';ctx.textAlign='left';ctx.fillText(s.base>1?`${s.base}品`:s.label,x,y+103*scale);ctx.textAlign='center';for(let i=0;i<6;i++){const v=s.frets[i],mark=v==='x'?'×':v===0?'○':'';if(mark){ctx.font=`${small?9:10}px sans-serif`;ctx.fillStyle='#676f64';ctx.fillText(mark,x0+i*dx,y0-5*scale)}}ctx.strokeStyle='#aeb5aa';ctx.lineWidth=1;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(x0+i*dx,y0);ctx.lineTo(x0+i*dx,y0+dy*4);ctx.stroke()}for(let j=0;j<=4;j++){ctx.beginPath();ctx.lineWidth=j===0&&s.base===1?2.2:1;ctx.moveTo(x0,y0+j*dy);ctx.lineTo(x0+dx*5,y0+j*dy);ctx.stroke()}if(s.barre){const fy=y0+(s.barre.fret-s.base+.5)*dy;ctx.fillStyle='#426349';ctx.beginPath();ctx.roundRect(x0+s.barre.from*dx-4*scale,fy-4*scale,(s.barre.to-s.barre.from)*dx+8*scale,8*scale,4*scale);ctx.fill();ctx.fillStyle='white';ctx.font=`bold ${small?6:7}px sans-serif`;ctx.fillText('1',x0+s.barre.from*dx,fy+2*scale)}for(let i=0;i<6;i++){const fret=s.frets[i];if(typeof fret!=='number'||fret===0||s.barre&&s.fingers[i]===1&&fret===s.barre.fret)continue;const cx=x0+i*dx,cy=y0+(fret-s.base+.5)*dy;ctx.fillStyle='#426349';ctx.beginPath();ctx.arc(cx,cy,4.2*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font=`bold ${small?6:7}px sans-serif`;ctx.fillText(String(s.fingers[i]||''),cx,cy+2.5*scale)}ctx.textAlign='left'}
